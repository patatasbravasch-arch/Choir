<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="guide-title guide-description"><title id="guide-title">Freesound · API credentials</title><desc id="guide-description">An example credentials table highlights the Client secret/Api key column and leaves Client ID unselected.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="360" height="240" rx="14" fill="#091727"/><path d="M14 0h332a14 14 0 0 1 14 14v28H0V14A14 14 0 0 1 14 0" fill="#15283f"/><text x="16" y="27" font-size="13" fill="#eef5fc" font-weight="600">Freesound · API credentials</text><rect x="287" y="11" width="59" height="22" rx="11" fill="#244e68"/><text x="296" y="26" font-size="10" fill="#bfefff" font-weight="600">Example</text><text x="20" y="73" font-size="18" fill="#eef5fc" font-weight="600">Your API credentials</text><rect x="20" y="91" width="312" height="71" rx="7" fill="#091727" stroke="#3b526b"/><path d="M115 91v71M20 122h312" stroke="#3b526b"/><text x="29" y="112" font-size="12" fill="#b4c4d6" font-weight="600">Client ID</text><text x="125" y="112" font-size="12" fill="#eef5fc" font-weight="600">Client secret/Api key</text><text x="29" y="146" font-size="13" fill="#b4c4d6" font-weight="400">(ID)</text><text x="125" y="146" font-size="15" fill="#71deff" font-weight="400">•••• •••• ••••</text><rect x="116" y="91" width="215" height="70" rx="9" fill="none" stroke="#71deff" stroke-width="2"/><path d="M105 126h9m-4-4 4 4-4 4" fill="none" stroke="#71deff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="193" font-size="13" fill="#71deff" font-weight="600">Copy the secret / API key column.</text><text x="20" y="215" font-size="12" fill="#b4c4d6" font-weight="400">Client ID is not the API key.</text><text x="16" y="234" font-size="10" fill="#b4c4d6" font-weight="400">Illustration · layout may change</text></g></svg>